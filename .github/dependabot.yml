version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "taiki-e/install-action"
        update-types: ["version-update:semver-patch"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    # The root manifest owns the workspace and shared lockfile, so this covers
    # every member, including spiffe-rustls-tokio and private tooling/examples.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
