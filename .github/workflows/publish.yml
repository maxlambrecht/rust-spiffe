name: Publish Crates

# Publishing authorization also relies on external GitHub and crates.io
# configuration: the `crates-io` environment is restricted to `main`, and
# crates.io Trusted Publishers require this workflow and environment.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, spiffe-0.18.0)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  RELEASE_RUST_VERSION: '1.99.0'

jobs:
  preflight:
    name: Validate release tag and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read

    outputs:
      crate: ${{ steps.preflight.outputs.crate }}
      version: ${{ steps.preflight.outputs.version }}
      lock_sha256: ${{ steps.preflight.outputs.lock_sha256 }}
      package_sha256: ${{ steps.preflight.outputs.package_sha256 }}
      cargo_version: ${{ steps.preflight.outputs.cargo_version }}

    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] ||
             [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::dispatch Publish Crates from refs/heads/main (got ${GITHUB_EVENT_NAME} on ${GITHUB_REF})"
            exit 1
          fi

      - name: Check out dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          # spire-api packages its pinned spire-api-sdk submodule.
          submodules: recursive
          persist-credentials: false

      - name: Fetch current main and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          git check-ref-format "refs/tags/${RELEASE_TAG}"

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Install pinned release Rust
        run: |
          set -euo pipefail

          rustup toolchain install "${RELEASE_RUST_VERSION}" \
            --profile minimal \
            --no-self-update

          rustup default "${RELEASE_RUST_VERSION}"
          cargo --version

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: cargo-deny@0.18.9

      # No build cache: release validation starts from a clean target directory.
      - name: Resolve and validate release
        id: preflight
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          selected="$(
            cargo run --locked --quiet -p xtask -- \
              release preflight "${RELEASE_TAG}" \
              --main-ref refs/remotes/origin/main \
              --expected-commit "${GITHUB_SHA}"
          )"

          case "${selected}" in
            spiffe|spire-api|spiffe-rustls|spiffe-rustls-tokio)
              ;;
            *)
              echo "::error::unexpected release crate: ${selected}"
              exit 1
              ;;
          esac

          make release-check CRATE="${selected}"

          # Cargo names the archive from the manifest it packaged, so this also
          # confirms Cargo's view of the crate name and version matches the tag.
          version="${RELEASE_TAG#"${selected}-"}"
          package_path="target/package/${selected}-${version}.crate"

          test -f "${package_path}"

          status="$(git status --porcelain --untracked-files=all)"
          test -z "${status}"

          {
            echo "crate=${selected}"
            echo "version=${version}"
            echo "lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "package_sha256=$(sha256sum "${package_path}" | awk '{print $1}')"
            echo "cargo_version=$(cargo --version)"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ needs.preflight.outputs.crate }} ${{ needs.preflight.outputs.version }}
    needs: preflight
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment: crates-io

    # Every step in this job can request an OIDC token, so it runs no build
    # scripts, proc macros, cached artifacts, or third-party actions other than
    # checkout and the crates.io authentication action.
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CRATE: ${{ needs.preflight.outputs.crate }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      EXPECTED_COMMIT: ${{ github.sha }}
      EXPECTED_LOCK_SHA256: ${{ needs.preflight.outputs.lock_sha256 }}
      EXPECTED_PACKAGE_SHA256: ${{ needs.preflight.outputs.package_sha256 }}
      EXPECTED_CARGO_VERSION: ${{ needs.preflight.outputs.cargo_version }}

    steps:
      - name: Check out dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          # spire-api packages its pinned spire-api-sdk submodule.
          submodules: recursive
          persist-credentials: false

      - name: Install pinned release Rust
        run: |
          set -euo pipefail

          rustup toolchain install "${RELEASE_RUST_VERSION}" \
            --profile minimal \
            --no-self-update

          rustup default "${RELEASE_RUST_VERSION}"
          cargo --version

      - name: Reproduce validated package before obtaining the crates.io credential
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/release-recheck.sh reproduce

      - name: Authenticate to crates.io with GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify` skips only Cargo's build of the package. That build, and
      # the release-lane builds of the unpacked archive, ran in preflight
      # without OIDC permission; the archive reproduced above has the same hash.
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          bash .github/workflows/scripts/release-recheck.sh final

          cargo publish \
            --locked \
            --no-verify \
            -p "${RELEASE_CRATE}"

  verify:
    name: Verify published checksum
    needs:
      - preflight
      - publish

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions: {}

    steps:
      - name: Compare crates.io checksum with the validated package
        env:
          RELEASE_CRATE: ${{ needs.preflight.outputs.crate }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.preflight.outputs.package_sha256 }}
        run: |
          set -euo pipefail

          url="https://crates.io/api/v1/crates/${RELEASE_CRATE}/${RELEASE_VERSION}"
          checksum=""

          for _ in $(seq 1 20); do
            if checksum="$(
              curl -fsSL \
                --proto '=https' \
                -A "${GITHUB_REPOSITORY} publish verification" \
                "${url}" |
                jq -er '.version.checksum'
            )"; then
              break
            fi

            checksum=""
            sleep 15
          done

          if [ "${checksum}" != "${EXPECTED_PACKAGE_SHA256}" ]; then
            echo "::error::crates.io checksum '${checksum}' for ${RELEASE_CRATE} ${RELEASE_VERSION} does not match the validated package ${EXPECTED_PACKAGE_SHA256}; yank the version and investigate"
            exit 1
          fi

          echo "crates.io checksum matches the validated package: ${checksum}"
